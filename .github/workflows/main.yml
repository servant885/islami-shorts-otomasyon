
name: Islami Shorts Otomasyon

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Kutuphaneleri yukle
        run: pip install -r requirements.txt

      - name: Islami Shorts videosu olustur
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py

      - name: Videoyu kaydet
        uses: actions/upload-artifact@v4
        with:
          name: islami-short
          path: output/
          if-no-files-found: error
          retention-days: 7
